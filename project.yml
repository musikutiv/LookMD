name: LookMD
options:
  bundleIdPrefix: com.musikutiv.lookmd
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: NO
    MARKETING_VERSION: "1.2.1"
    CURRENT_PROJECT_VERSION: "1"

targets:
  LookMD:
    type: application
    platform: macOS
    sources:
      - path: LookMD/Sources
      - path: Shared/Sources
      - path: Shared/Resources
        buildPhase: resources
    info:
      path: LookMD/Info.plist
      properties:
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "Copyright © 2026 musikutiv."
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - net.daringfireball.markdown
          - CFBundleTypeName: R Markdown Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.musikutiv.lookmd.rmarkdown
          - CFBundleTypeName: Quarto Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.musikutiv.lookmd.qmd
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeConformsTo:
              - public.plain-text
            UTTypeDescription: Markdown Document
            UTTypeTagSpecification:
              public.filename-extension:
                - md
                - markdown
                - mdown
                - mkdn
                - mkd
          - UTTypeIdentifier: com.musikutiv.lookmd.rmarkdown
            UTTypeConformsTo:
              - public.plain-text
            UTTypeDescription: R Markdown Document
            UTTypeTagSpecification:
              public.filename-extension:
                - Rmd
          - UTTypeIdentifier: com.musikutiv.lookmd.qmd
            UTTypeConformsTo:
              - public.plain-text
            UTTypeDescription: Quarto Document
            UTTypeTagSpecification:
              public.filename-extension:
                - qmd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.musikutiv.lookmd
        PRODUCT_NAME: LookMD
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_ENTITLEMENTS: LookMD/LookMD.entitlements
    dependencies:
      - target: LookMDQuickLook
        embed: true
        codeSign: true

  LookMDQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: LookMDQuickLook/Sources
      - path: Shared/Sources
      - path: Shared/Resources
        buildPhase: resources
    info:
      path: LookMDQuickLook/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - net.daringfireball.markdown
              - com.musikutiv.lookmd.rmarkdown
              - com.musikutiv.lookmd.qmd
            QLSupportsSearchableItems: NO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.musikutiv.lookmd.QuickLookExtension
        PRODUCT_NAME: LookMDQuickLook
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_ENTITLEMENTS: LookMDQuickLook/LookMDQuickLook.entitlements
    dependencies:
      - sdk: QuickLookUI.framework
      - sdk: WebKit.framework

schemes:
  LookMD:
    build:
      targets:
        LookMD: all
    run:
      config: Debug
